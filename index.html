<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hola IA 🤖</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#111;color:#fff}
main{text-align:center;max-width:620px;padding:32px}h1{font-size:clamp(42px,9vw,82px);margin:0 0 12px}p{opacity:.75;font-size:18px}
button{margin-top:20px;padding:14px 22px;border:0;border-radius:999px;font-size:17px;cursor:pointer}
#msg{min-height:28px;margin-top:24px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Hola IA 🤖</h1>
<p>Un pequeño experimento apareció aquí de repente.</p>
<button id="btn">Sorpréndeme</button>
<div id="msg"></div>
</main>
<script>
const mensajes=[
"🤖 La IA ha entrado en modo misterio.",
"🚀 Próxima parada: algo inesperado.",
"🧠 Pensando... 01001000 01101001",
"✨ Este botón no tenía por qué existir. Pero existe.",
"🎲 Has desbloqueado una sorpresa completamente aleatoria.",
"👀 Ahora mira el repositorio y descubre qué más hay."
];
document.querySelector("#btn").onclick=()=>{
 document.querySelector("#msg").textContent=mensajes[Math.floor(Math.random()*mensajes.length)];
};
</script>
</body>
</html>
